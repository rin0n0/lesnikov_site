<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111; color: white; font-family: sans-serif; }
.grid { display: flex; flex-wrap: wrap; gap: 20px; }
.card { background: #222; padding: 10px; border-radius: 8px; text-align: center; }
img { max-width: 300px; max-height: 300px; display: block; margin: auto; }
</style>
</head>
<body>
<h1>Home Images Check</h1>
<div id="container"></div>
<script>
fetch('/api/data')
  .then(r => r.json())
  .then(data => {
    const c = document.getElementById('container');
    const h2 = document.createElement('h2');
    h2.textContent = 'Home Hero Images (' + data.home.hero_images.length + ')';
    c.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const img of data.home.hero_images) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="/uploads/${img}"><div>${img}</div>`;
      grid.appendChild(card);
    }
    c.appendChild(grid);
  });
</script>
</body>
</html>
