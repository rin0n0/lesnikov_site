name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'rinnxx' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 14888 }}
          script: |
            # Папка проекта в домашней директории пользователя (например: /home/rinnxx/lesnikov_site)
            PROJECT_DIR="$HOME/lesnikov_site"
            
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # Клонируем или обновляем репозиторий
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # Генерируем backend/.env на сервере
            cat << 'EOF' > backend/.env
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
            EOF

            # Перезапуск контейнеров через Docker Compose
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            # Очистка старых слоёв
            docker image prune -f
