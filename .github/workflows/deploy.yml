name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }} # Если ключ с паролем (опционально)
          password: ${{ secrets.SERVER_PASSWORD }}         # Если вход по паролю (опционально)
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Папка на сервере
            PROJECT_DIR="/var/www/lesnikov_site"
            
            # Создаем папку, если ее нет
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR

            # Если репозиторий еще не склонирован
            if [ ! -d ".git" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # Создаем/обновляем backend/.env на сервере из GitHub Secrets
            cat << 'EOF' > backend/.env
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
            EOF

            # Пересобираем и перезапускаем Docker контейнеры
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            # Очищаем старые неиспользуемые Docker-образы
            docker image prune -f
