name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'rinnxx' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 14888 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on VPS..."
            
            PROJECT_DIR="$HOME/lesnikov_site"
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"

            # Инициализация Git (совместима со старыми и новыми версиями Git)
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository..."
              git init
            fi

            # Привязываем origin
            git remote remove origin 2>/dev/null || true
            git remote add origin https://github.com/${{ github.repository }}.git

            # Синхронизация
            echo "Fetching and synchronizing with origin/main..."
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            # Генерируем backend/.env
            echo "Creating backend/.env..."
            cat << 'EOF' > backend/.env
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
            EOF

            # Пересобираем контейнеры начисто
            echo "Building containers with no-cache..."
            docker compose build --no-cache

            echo "Starting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployment finished successfully!"
