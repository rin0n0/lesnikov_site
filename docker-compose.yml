name: lesnikov

services:
  xray:
    image: teddysun/xray:latest
    container_name: lesnikov_xray
    restart: always
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    networks:
      - app-net

  backend:
    build: ./backend
    container_name: lesnikov_backend
    ports:
      - "8003:8000"
    restart: always
    env_file:
      - backend/.env
    environment:
      - PROXY_URL=http://xray:10809
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      - xray
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: lesnikov_frontend
    depends_on:
      - backend
    restart: always
    ports:
      - "8091:80"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
