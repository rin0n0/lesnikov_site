server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        image/svg+xml svg;
    }

    client_max_body_size 100M;

    # High performance socket & file caching options
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors off;

    # Aggressive Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/javascript 
        application/json 
        image/svg+xml 
        application/xml+rss 
        font/eot 
        font/otf 
        font/ttf 
        application/font-woff 
        application/vnd.ms-fontobject;

    root /usr/share/nginx/html;
    index index.html;

    # Никогда не кэшировать index.html, чтобы пользователи мгновенно получали новые версии
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Статические ассеты с хешами (JS, CSS) - ^~ исключает проверку регулярных выражений
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API Proxy to FastAPI Backend - ^~ исключает перехват регулярными выражениями
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Uploads Proxy (images and thumbnails) - ^~ ГАРАНТИРУЕТ проксирование в backend без перехвата
    location ^~ /uploads {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Только статические картинки КОРНЯ (/avatar.jpg, /favicon.svg)
    location ~* ^/[^/]+\.(svg|jpg|jpeg|png|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
