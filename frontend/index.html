<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Владимир Лесников — Фотограф | Санкт-Петербург</title>
    <meta name="description" content="Профессиональная фотосъемка выпускных альбомов для детских садов и школ (4, 9, 11 класс), свадебная, семейная и индивидуальная фотография в Санкт-Петербурге и ЛО. Владимир Лесников." />
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Владимир Лесников — Фотограф | Санкт-Петербург" />
    <meta property="og:description" content="Выпускные альбомы для детских садов и школ, индивидуальные и семейные фотосессии в Санкт-Петербурге и Ленинградской области." />
    <meta property="og:image" content="/uploads/home_d126d401.jpg" />
    <!-- Theme Detection & Synchronization -->
    <script>
      (function() {
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (e.matches) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          });
        }
      })();
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

    <div id="app"></div>

  </body>
